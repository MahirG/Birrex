name: BirrEX build and deploy
on:
  push:
    branches: [birrex-signature-edition]
    paths: ['exchange/**', '.github/workflows/birrex.yml']
  pull_request:
    branches: [main]
    paths: ['exchange/**', '.github/workflows/birrex.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: birrex-cloudflare-release
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node exchange/scripts/build.mjs
      - run: node exchange/scripts/test.mjs
      - name: Install browser acceptance dependency
        run: npm install --prefix exchange --no-save --no-package-lock playwright@1.56.1
      - name: Install browser engines
        run: exchange/node_modules/.bin/playwright install --with-deps chromium firefox webkit
      - name: Cross-browser responsive acceptance
        run: node exchange/scripts/test-browser.mjs
      - name: Publish after verification when credentials are configured
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/birrex-signature-edition'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets missing: deployment skipped."
          else
            node exchange/scripts/deploy.mjs
          fi
